version: "1.0"
pipeline_name: "Crowd Counting Density Map ETL Pipeline"
description: "Quy chuẩn kỹ thuật cho dữ liệu đầu vào, biến đổi Gaussian và xuất bản đồ mật độ"

input_spec:
  dataset_root: "Crowd_Counting_ShanghaiTech/ShanghaiTech"
  image_formats: [".jpg", ".png", ".jpeg"]
  color_space: "RGB"
  structure:
    part_a:
      train_images: "part_A/train_data/images"
      train_gt: "part_A/train_data/ground-truth"
      test_images: "part_A/test_data/images"
      test_gt: "part_A/test_data/ground-truth"
    part_b:
      train_images: "part_B/train_data/images"
      train_gt: "part_B/train_data/ground-truth"
      test_images: "part_B/test_data/images"
      test_gt: "part_B/test_data/ground-truth"
  annotation_formats:
    matlab:
      file_ext: ".mat"
      variable_key: "image_info"
      location_subfield: "location"
    json:
      file_ext: ".json"
      keys: ["points", "heads"]

transformation_spec:
  density_map:
    downsample_factor: 8
    integral_scale_factor: 64
    methods:
      geometry_adaptive:
        k_nearest_neighbors: 3
        beta: 0.3
        applicable_to: "congested_scenes"
      fixed_kernel:
        sigma: 15
        applicable_to: "sparse_scenes"
  output_format:
    container: "HDF5 (.h5)"
    dataset_key: "density"
    dtype: "float32"

manifests:
  train_json: "part_A_train.json"
  val_json: "part_A_val.json"
  test_json: "part_A_test.json"

